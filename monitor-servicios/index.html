<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor Servicios - El Desembarco</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%2322c55e'/></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #1a1a1a;
      color: #fff;
      transition: background-color 0.6s ease;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    body.up   { background: #14532d; }
    body.down { background: #dc2626; animation: pulse 0.8s infinite; }
    body.loading { background: #1f2937; }

    @keyframes pulse {
      0%, 100% { background: #dc2626; }
      50%      { background: #ef4444; }
    }

    .wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2vh 4vw;
      text-align: center;
      min-width: 0;
    }

    .status {
      font-size: min(17vw, 40vh, 220px);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.04em;
      text-shadow: 0 6px 30px rgba(0,0,0,0.45);
      user-select: none;
      white-space: nowrap;
      max-width: 100%;
    }

    .label {
      font-size: min(3.6vw, 7vh, 44px);
      font-weight: 700;
      margin-top: 2vh;
      opacity: 0.92;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      max-width: 92vw;
      overflow-wrap: anywhere;
      line-height: 1.15;
    }

    .url {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: clamp(12px, 1.6vw, 24px);
      margin-top: 1.5vh;
      opacity: 0.55;
      word-break: break-all;
      max-width: 90vw;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 1.5vh 3vw;
      font-size: clamp(12px, 1.3vw, 18px);
      opacity: 0.7;
      gap: 0.6rem 1.2rem;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .meta span { white-space: nowrap; }

    /* Mobile portrait: stack meta items */
    @media (max-width: 600px) {
      html, body { overflow-y: auto; }
      body { min-height: 100vh; height: auto; }
      .wrap { padding: 4vh 5vw; }
      .status {
        font-size: min(22vw, 30vh, 160px);
      }
      .label {
        font-size: min(5.5vw, 6vh, 26px);
        letter-spacing: 0.05em;
      }
      .meta {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.4rem;
        padding: 2vh 5vw;
        font-size: 13px;
      }
    }

    /* Landscape phone: keep it compact, no scroll */
    @media (max-height: 500px) and (orientation: landscape) {
      .status { font-size: min(15vw, 50vh, 180px); }
      .label  { font-size: min(2.8vw, 6vh, 22px); margin-top: 1vh; }
      .url    { margin-top: 0.8vh; }
      .meta   { padding: 1vh 3vw; gap: 0.4rem 1rem; }
    }

    .dot {
      display: inline-block;
      width: 0.8em;
      height: 0.8em;
      border-radius: 50%;
      background: #fbbf24;
      margin-right: 0.5em;
      vertical-align: middle;
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.3; } }

    body.up .dot   { background: #22c55e; animation: none; }
    body.down .dot { background: #ef4444; animation: blink 0.6s infinite; }

    .countdown {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }
  </style>
</head>
<body class="loading">
  <div class="wrap">
    <div class="status" id="status">···</div>
    <div class="label" id="label">Cargando estado</div>
    <div class="url" id="url">desembarco.sytes.net</div>
  </div>
  <div class="meta">
    <span><span class="dot"></span><span id="service-name">Servidor Desembarco</span></span>
    <span id="latency">— ms</span>
    <span id="last-check">Último chequeo: —</span>
    <span>Refresca en <span class="countdown" id="countdown">30</span>s</span>
  </div>

  <script>
    const ENDPOINT = "https://n8n.srv1312396.hstgr.cloud/webhook/monitor";
    const REFRESH_SECONDS = 30;

    const $status   = document.getElementById("status");
    const $label    = document.getElementById("label");
    const $url      = document.getElementById("url");
    const $name     = document.getElementById("service-name");
    const $latency  = document.getElementById("latency");
    const $lastCheck= document.getElementById("last-check");
    const $countdown= document.getElementById("countdown");

    let countdown = REFRESH_SECONDS;

    function fmtTime(d) {
      return d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    async function check() {
      document.body.className = "loading";
      $status.textContent = "···";
      $label.textContent = "Chequeando";

      try {
        const r = await fetch(ENDPOINT, { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const data = await r.json();
        const svc = (data.services && data.services[0]) || null;
        if (!svc) throw new Error("Respuesta sin servicios");

        $name.textContent = svc.name || "Servicio";
        $url.textContent = svc.url || "";
        $latency.textContent = (svc.latency_ms != null ? svc.latency_ms : "—") + " ms";
        $lastCheck.textContent = "Último chequeo: " + fmtTime(new Date());

        if (svc.up) {
          document.body.className = "up";
          $status.textContent = "VAMOS!";
          $label.textContent = "Esta levantado Qlik! MAIAMEEEEEE";
        } else {
          document.body.className = "down";
          $status.textContent = "MAMA";
          $label.textContent = "CORTASTE TODA LA LOZ";
        }
      } catch (e) {
        document.body.className = "down";
        $status.textContent = "?";
        $label.textContent = "No se pudo consultar el monitor: " + e.message;
        $lastCheck.textContent = "Último chequeo: " + fmtTime(new Date());
      }

      countdown = REFRESH_SECONDS;
    }

    setInterval(() => {
      countdown -= 1;
      if (countdown <= 0) { check(); return; }
      $countdown.textContent = countdown;
    }, 1000);

    check();
  </script>
</body>
</html>
