<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Tasty — Stock Aniversario Grupo El Desembarco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #F5A800;
            --bg:     #181818;
            --surf:   #1E1E1E;
            --text:   #FFFFFF;
            --muted:  rgba(255,255,255,0.55);
            --line:   rgba(255,255,255,0.07);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Barlow', system-ui, sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── HERO ── */
        .hero {
            position: relative;
            text-align: center;
            padding: 3.5rem 2rem 3.5rem;
            overflow: hidden;
            background: #181818;
        }

        .rays {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Logo */
        .logo-wrap {
            position: relative;
            display: block;
            width: 130px;
            margin: 0 auto 2rem;
        }
        .logo-wrap svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Título */
        .hero-title {
            position: relative;
            font-family: 'Anton', Impact, sans-serif;
            font-size: clamp(2.2rem, 6.5vw, 5rem);
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.01em;
        }
        .title-white {
            color: #FFFFFF;
            display: block;
            margin-bottom: 0.55rem;
        }
        .title-orange {
            color: var(--orange);
            display: block;
            white-space: nowrap;
            font-size: clamp(2rem, 6vw, 4.6rem);
        }

        .hero-rule {
            width: 80px;
            height: 3px;
            background: var(--orange);
            border-radius: 2px;
            margin: 1.6rem auto 1.8rem;
        }

        .hero-sub {
            position: relative;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: clamp(0.78rem, 1.8vw, 0.95rem);
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text);
            max-width: 680px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* ── CONTENIDO ── */
        .content {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
        }

        /* ── BUSCADOR ── */
        .search-wrap {
            display: none;
            position: relative;
            max-width: 420px;
            margin: 0 0 1.5rem;
        }
        .search-wrap.visible { display: block; }
        .search-wrap svg {
            position: absolute;
            left: 1rem; top: 50%;
            transform: translateY(-50%);
            width: 18px; height: 18px;
            color: var(--muted);
            pointer-events: none;
        }
        #search-input {
            width: 100%;
            padding: .78rem 1rem .78rem 2.7rem;
            background: var(--surf);
            border: 1px solid var(--line);
            border-radius: 24px;
            color: var(--text);
            font-family: 'Barlow Condensed', sans-serif;
            font-size: .92rem;
            font-weight: 500;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        #search-input::placeholder { color: var(--muted); }
        #search-input:focus {
            border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(245,168,0,0.15);
        }
        .search-empty {
            display: none;
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--muted);
            font-family: 'Barlow Condensed', sans-serif;
            font-size: .95rem;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .search-empty.visible { display: block; }
        .state-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 5rem 2rem;
            color: var(--muted);
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .spinner {
            width: 30px; height: 30px;
            border: 2px solid rgba(255,255,255,0.08);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin .75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── ERROR ── */
        .state-error {
            display: none;
            margin: 2rem auto;
            max-width: 580px;
            padding: 1.25rem 1.5rem;
            background: rgba(200,40,40,.07);
            border: 1px solid rgba(200,40,40,.2);
            border-radius: 6px;
            color: #FF8080;
            font-size: .875rem;
            white-space: pre-line;
        }

        /* ── TABLA DESKTOP ── */
        .table-shell { display: none; border-radius: 6px; overflow: hidden; }
        .table-scroll { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surf);
        }

        thead th {
            background: var(--orange);
            padding: 1rem 1.5rem;
            text-align: left;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #111111;
            white-space: nowrap;
        }

        tbody tr { border-bottom: 1px solid var(--line); transition: background .12s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: rgba(245,168,0,0.05); }

        tbody td {
            padding: .9rem 1.5rem;
            font-size: .9rem;
            color: var(--text);
            vertical-align: middle;
        }
        tbody td.col-local {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        a { color: var(--orange); text-decoration: none; }
        a:hover { text-decoration: underline; }
        td.col-phone a { color: var(--muted); }
        td.col-phone a:hover { color: var(--orange); }
        .val-empty { color: rgba(255,255,255,0.18); }

        /* Stock badges */
        .badge {
            display: inline-block;
            padding: .25rem .65rem;
            border-radius: 4px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .badge-yes { background: rgba(34,197,94,.15); color: #4ade80; border: 1px solid rgba(34,197,94,.35); }
        .badge-no  { background: rgba(239,68,68,.15);  color: #f87171; border: 1px solid rgba(239,68,68,.35); }

        /* ── TARJETAS MOBILE ── */
        .cards-wrap { display: none; flex-direction: column; gap: .9rem; }

        .card { background: var(--surf); border-radius: 6px; overflow: hidden; }
        .card-head { background: var(--orange); padding: .7rem 1.2rem; }
        .card-local {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #111;
        }
        .card-body { padding: .6rem 1.2rem .9rem; }
        .card-field { display: flex; flex-direction: column; padding: .45rem 0; border-bottom: 1px solid var(--line); }
        .card-field:last-child { border-bottom: none; }
        .card-lbl {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: .6rem; font-weight: 700;
            letter-spacing: .18em; text-transform: uppercase;
            color: var(--orange); margin-bottom: .1rem;
        }
        .card-val { font-size: .9rem; color: var(--text); }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .table-shell.visible { display: none !important; }
            .cards-wrap.visible  { display: flex; }
            .content { padding-left: 1rem; padding-right: 1rem; }
            .logo-wrap { width: 100px; }
        }
        @media (min-width: 769px) {
            .table-shell.visible { display: block; }
            .cards-wrap.visible  { display: none !important; }
        }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding: 1.25rem 2rem;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: .65rem;
            font-weight: 600;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.18);
            border-top: 1px solid var(--line);
        }
    </style>
</head>

    <h1 class="hero-title">
        <span class="title-white">STOCK ANIVERSARIO</span>
        <span class="title-orange">GRUPO EL DESEMBARCO</span>
    </h1>

    <div class="hero-rule"></div>

    <p class="hero-sub">
        A continuación podrás conocer el stock disponible en cada sucursal,<br>
        acompañado de su dirección y teléfono.
    </p>

</section>

<div class="content">

    <div id="loading" class="state-loading">
        <div class="spinner"></div>
        <span>Cargando sucursales…</span>
    </div>

    <div id="error" class="state-error"></div>

    <div id="search-wrap" class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Buscar sucursal...">
    </div>

    <div id="search-empty" class="search-empty">No encontramos ninguna sucursal con ese nombre.</div>

    <div id="table-shell" class="table-shell">
        <div class="table-scroll">
            <table>
                <thead><tr id="thead-tr"></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>

    <div id="cards-wrap" class="cards-wrap"></div>

</div>

<footer>Mr. Tasty &nbsp;·&nbsp; Stock Aniversario Grupo El Desembarco</footer>

<script>
// Primero el proxy propio (cacheado en CDN, inmune a adblockers/CORS/rate limits de Google);
// si falla, va directo al CSV publicado de Google. Cada fuente se intenta 2 veces.
const CSV_SOURCES = [
    '/api/stock',
    'https://docs.google.com/spreadsheets/d/e/2PACX-1vTBK1Zo3HAFY9U4SuTnFEy7zqq6MBPIe_QeEyufp8lBu7ZTIJ9kJiQc4A7LEo5aflDts8D2mLjU-h6S/pub?output=csv',
];

const TARGET_COLS = [
    'LOCAL',
    'DIRECCIÓN',
    'TELÉFONO',
    'TODO EL DÍA BURGER QUESO A $3.000',
];

const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v||'').trim());
const isPhone = v => /^[\d\s\-()+]{6,20}$/.test((v||'').trim());

function esc(s) {
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function cellHTML(raw, colName) {
    const v = (raw||'').trim();
    if (!v) return '<span class="val-empty">—</span>';
    if (isEmail(v))  return `<a href="mailto:${esc(v)}">${esc(v)}</a>`;
    if (colName === 'TELÉFONO' && isPhone(v))
        return `<a href="tel:${v.replace(/[^\d+]/g,'')}">${esc(v)}</a>`;
    const vUp = v.toUpperCase();
    if (vUp.includes('CON STOCK')) return `<span class="badge badge-yes">${esc(v)}</span>`;
    if (vUp.includes('SIN STOCK')) return `<span class="badge badge-no">${esc(v)}</span>`;
    return esc(v);
}

function parseCSV(raw) {
    const rows = [];
    let row = [], field = '', inQ = false;
    for (let i = 0; i < raw.length; i++) {
        const c = raw[i];
        if (c === '"') {
            if (inQ && raw[i+1] === '"') { field += '"'; i++; }
            else inQ = !inQ;
        } else if (c === ',' && !inQ) {
            row.push(field); field = '';
        } else if ((c === '\n' || c === '\r') && !inQ) {
            if (c === '\r' && raw[i+1] === '\n') i++;
            row.push(field); field = '';
            if (row.some(f => f.trim())) rows.push(row);
            row = [];
        } else { field += c; }
    }
    row.push(field);
    if (row.some(f => f.trim())) rows.push(row);
    return rows;
}

function normalizarTexto(s) {
    return (s||'').toString()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .toLowerCase().trim();
}

function render(rows) {
    // Normalizar: colapsar múltiples espacios para evitar discrepancias con la planilla
    const norm = s => s.replace(/\s+/g, ' ').trim();

    const headers = rows[0].map(h => norm(h));
    const cols = TARGET_COLS.map(name => ({ name, idx: headers.indexOf(norm(name)) })).filter(c => c.idx !== -1);
    if (!cols.length) { showError('No se encontraron las columnas esperadas.'); return; }

    const data = rows.slice(1).filter(r => r.some(c => c.trim()));

    const thead = document.getElementById('thead-tr');
    cols.forEach(col => {
        const th = document.createElement('th');
        th.textContent = col.name;
        thead.appendChild(th);
    });

    const tbody = document.getElementById('tbody');
    data.forEach(r => {
        const tr = document.createElement('tr');
        const localCol2 = cols.find(c => c.name === 'LOCAL');
        const sucVal = localCol2 ? (r[localCol2.idx]||'').trim() : '';
        tr.dataset.sucursal = normalizarTexto(sucVal);
        cols.forEach(col => {
            const td = document.createElement('td');
            td.innerHTML = cellHTML(r[col.idx], col.name);
            if (col.name === 'LOCAL')    td.classList.add('col-local');
            if (col.name === 'TELÉFONO') td.classList.add('col-phone');
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });

    const wrap     = document.getElementById('cards-wrap');
    const localCol = cols.find(c => c.name === 'LOCAL');
    data.forEach(r => {
        const localVal = localCol ? (r[localCol.idx]||'').trim() : '';
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.sucursal = normalizarTexto(localVal);
        card.innerHTML = `<div class="card-head"><div class="card-local">${esc(localVal)||'—'}</div></div><div class="card-body"></div>`;
        const body = card.querySelector('.card-body');
        cols.filter(c => c.name !== 'LOCAL').forEach(col => {
            const f = document.createElement('div');
            f.className = 'card-field';
            f.innerHTML = `<span class="card-lbl">${esc(col.name)}</span><span class="card-val">${cellHTML(r[col.idx], col.name)}</span>`;
            body.appendChild(f);
        });
        wrap.appendChild(card);
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('table-shell').classList.add('visible');
    document.getElementById('cards-wrap').classList.add('visible');
    document.getElementById('search-wrap').classList.add('visible');

    inicializarBuscador();
}

function inicializarBuscador() {
    const input    = document.getElementById('search-input');
    const filas    = document.querySelectorAll('#tbody tr');
    const tarjetas = document.querySelectorAll('#cards-wrap .card');
    const vacio    = document.getElementById('search-empty');

    input.addEventListener('input', () => {
        const q = normalizarTexto(input.value);
        let visibles = 0;

        filas.forEach(tr => {
            const match = (tr.dataset.sucursal || '').includes(q);
            tr.style.display = match ? '' : 'none';
            if (match) visibles++;
        });

        tarjetas.forEach(card => {
            const match = (card.dataset.sucursal || '').includes(q);
            card.style.display = match ? '' : 'none';
        });

        vacio.classList.toggle('visible', visibles === 0 && q !== '');
    });
}

function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
}

async function fetchCSV() {
    let lastErr;
    for (const src of CSV_SOURCES) {
        for (let intento = 0; intento < 2; intento++) {
            try {
                const sep = src.includes('?') ? '&' : '?';
                const res = await fetch(src + sep + 't=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.text();
            } catch (e) {
                lastErr = e;
                await new Promise(r => setTimeout(r, 800));
            }
        }
    }
    throw lastErr;
}

(async () => {
    try {
        const text = await fetchCSV();
        const rows = parseCSV(text);
        if (rows.length < 2) throw new Error('La planilla no tiene datos.');
        render(rows);
    } catch (e) {
        showError(`No se pudo cargar la planilla.\nProbá recargando la página.\n\n${e.message}`);
    }
})();
</script>
