<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Forms detection</title>
  </head>
  <body>
    <form name="contacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="nombre" />
      <input type="email" name="email" />
      <input type="text" name="asunto" />
      <textarea name="historia"></textarea>
    </form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
    </form>
  </body>
</html>
